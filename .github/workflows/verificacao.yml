name: Verificacao

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificacao:
    name: Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # os scripts da skill correm no Python de quem a instala: tem de compilar no 3.8 e no mais novo
      - name: Sintaxe dos scripts
        run: python -m compileall -q skills/makerworld-to-any/scripts
      - name: Instalador
        run: node bin/instalar.js --destino "${{ runner.temp }}/skills"
