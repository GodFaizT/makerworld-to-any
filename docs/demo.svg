<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-label="Exemplo: /kobrax adapta Anjo.3mf para a Kobra X e mostra tempo e gramas de cada prato">
