<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="bambu-para-kobra-x: projetos Bambu Lab e MakerWorld prontos para a Anycubic Kobra X">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1419"/>
      <stop offset="1" stop-color="#1b2330"/>
    </linearGradient>
    <linearGradient id="seta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="camadas" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <pattern id="grelha" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="340" rx="18" fill="url(#fundo)"/>
  <rect width="1280" height="340" rx="18" fill="url(#grelha)"/>

  <!-- peca a ser impressa: camadas -->
  <g transform="translate(118 64)">
    <rect x="-34" y="214" width="268" height="10" rx="3" fill="#2a3442"/>
    <g fill="url(#camadas)">
      <rect x="10" y="196" width="180" height="15" rx="7.5"/>
      <rect x="20" y="178" width="160" height="15" rx="7.5" opacity="0.95"/>
      <rect x="32" y="160" width="136" height="15" rx="7.5" opacity="0.9"/>
      <rect x="46" y="142" width="108" height="15" rx="7.5" opacity="0.85"/>
      <rect x="60" y="124" width="80" height="15" rx="7.5" opacity="0.8"/>
      <rect x="72" y="106" width="44" height="15" rx="7.5" opacity="0.75"/>
    </g>
    <!-- bico -->
    <g transform="translate(118 18)">
      <rect x="-30" y="0" width="60" height="38" rx="6" fill="#cbd5e1"/>
      <rect x="-30" y="0" width="60" height="10" rx="5" fill="#94a3b8"/>
      <path d="M-16 38 H16 L6 64 H-6 Z" fill="#e2e8f0"/>
      <circle cx="0" cy="74" r="4" fill="#f59e0b"/>
      <path d="M0 78 Q -10 84 -22 86" stroke="#f59e0b" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- texto -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="440" y="118" font-size="30" font-weight="600" fill="#94a3b8" letter-spacing="3">CLAUDE CODE SKILL</text>
    <text x="440" y="182" font-size="58" font-weight="800" fill="#f8fafc">Bambu Lab <tspan fill="#38bdf8" dx="6">→</tspan> <tspan dx="6">Kobra X</tspan></text>
    <text x="442" y="236" font-size="26" fill="#cbd5e1">Projetos do MakerWorld prontos a imprimir na Anycubic Kobra X,</text>
    <text x="442" y="272" font-size="26" fill="#cbd5e1">com perfis, cores, torre de purga e tempo de impressão verificados.</text>
    <text x="1240" y="318" font-size="18" font-weight="600" fill="#64748b" text-anchor="end">feito pela Megatic · megatic.pt</text>
  </g>
</svg>
