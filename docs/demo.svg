<svg xmlns="http://www.w3.org/2000/svg" width="900" height="589" viewBox="0 0 900 589" role="img" aria-label="Relatorio real do adaptar.py com o projeto de exemplo (2 pratos, 2 cores) para a Anycubic Kobra X">
  <rect x="0.5" y="0.5" width="899" height="588" rx="12" fill="#0f1419" stroke="#2a3442"/>
  <rect x="0.5" y="0.5" width="899" height="38" rx="12" fill="#1c2430"/>
  <rect x="0.5" y="24" width="899" height="15" fill="#1c2430"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
  <text x="450.0" y="25" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#7d8a99">Relatorio real do adaptar.py com o projeto de exemplo (2 pratos, 2 cores) para a Anycubic Kobra X</text>
  <g font-family="'Cascadia Code', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="12.5" xml:space="preserve">
    <text x="26" y="66"><tspan fill="#3fb950">&gt; </tspan><tspan fill="#ffffff" font-weight="bold">python adaptar.py "C:\Modelos\Exemplo.3mf"</tspan></text>
    <text x="26" y="104"><tspan fill="#30363d">======================================================================</tspan></text>
    <text x="26" y="123"><tspan fill="#58a6ff" font-weight="bold">ORIGINAL&#160;:</tspan><tspan fill="#d8dee6">&#160;C:\Modelos\Exemplo.3mf</tspan></text>
    <text x="26" y="142"><tspan fill="#d8dee6">&#160;&#160;impressora:&#160;Bambu&#160;Lab&#160;A1&#160;|&#160;perfil:&#160;0.20mm&#160;Standard&#160;@BBL&#160;A1</tspan></text>
    <text x="26" y="161"><tspan fill="#d8dee6">&#160;&#160;pratos:&#160;2&#160;|&#160;nomes:&#160;1=Caixa;&#160;2=Tampa</tspan></text>
    <text x="26" y="180"><tspan fill="#d8dee6">&#160;&#160;filamentos&#160;no&#160;projeto:&#160;4&#160;|&#160;usados:&#160;[2,&#160;4]</tspan></text>
    <text x="26" y="199"><tspan fill="#58a6ff" font-weight="bold">ADAPTADO&#160;:</tspan><tspan fill="#d8dee6">&#160;C:\Modelos\Exemplo&#160;-&#160;Kobra&#160;X.3mf</tspan></text>
    <text x="26" y="218"><tspan fill="#d8dee6">&#160;&#160;impressora:&#160;Anycubic&#160;Kobra&#160;X&#160;(bico&#160;0.4,&#160;mesa&#160;260&#160;x&#160;260&#160;x&#160;260&#160;mm,&#160;com&#160;ACE)&#160;|&#160;fim&#160;de&#160;impressao:&#160;levanta&#160;o&#160;bico</tspan></text>
    <text x="26" y="237"><tspan fill="#d8dee6">&#160;&#160;perfis:&#160;de&#160;origem&#160;da&#160;Anycubic</tspan></text>
    <text x="26" y="256"><tspan fill="#d8dee6">&#160;&#160;perfil:&#160;0.20mm&#160;Standard&#160;@Anycubic&#160;Kobra&#160;X&#160;0.4&#160;nozzle</tspan></text>
    <text x="26" y="275"><tspan fill="#d8dee6">&#160;&#160;&#160;&#160;enable_support:&#160;0&#160;-&gt;&#160;1&#160;&#160;&#160;</tspan><tspan fill="#7d8a99">[o&#160;autor&#160;mudou]</tspan></text>
    <text x="26" y="294"><tspan fill="#d8dee6">&#160;&#160;&#160;&#160;sparse_infill_density:&#160;15%&#160;-&gt;&#160;10%&#160;&#160;&#160;</tspan><tspan fill="#7d8a99">[o&#160;autor&#160;mudou]</tspan></text>
    <text x="26" y="313"><tspan fill="#d8dee6">&#160;&#160;&#160;&#160;sparse_infill_pattern:&#160;grid&#160;-&gt;&#160;gyroid&#160;&#160;&#160;</tspan><tspan fill="#7d8a99">[o&#160;autor&#160;mudou]</tspan></text>
    <text x="26" y="332"><tspan fill="#d8dee6">&#160;&#160;&#160;&#160;wall_loops:&#160;2&#160;-&gt;&#160;3&#160;&#160;&#160;</tspan><tspan fill="#7d8a99">[valor&#160;do&#160;perfil&#160;do&#160;autor]</tspan></text>
    <text x="26" y="351"><tspan fill="#e3b341">&#160;&#160;do&#160;autor,&#160;nao&#160;passou&#160;(velocidade&#160;acima&#160;do&#160;perfil&#160;da&#160;Anycubic&#160;Kobra&#160;X):&#160;outer_wall_speed&#160;350&#160;&gt;&#160;200</tspan></text>
    <text x="26" y="370"><tspan fill="#d8dee6">&#160;&#160;filamento&#160;1:&#160;Anycubic&#160;PLA&#160;Matte&#160;</tspan><tspan fill="#F2C94C" font-weight="bold">#F2C94C</tspan><tspan fill="#d8dee6">&#160;&#160;(era&#160;Bambu&#160;PLA&#160;Matte&#160;@BBL&#160;A1)</tspan></text>
    <text x="26" y="389"><tspan fill="#d8dee6">&#160;&#160;filamento&#160;2:&#160;Anycubic&#160;PLA&#160;Silk&#160;</tspan><tspan fill="#C0392B" font-weight="bold">#C0392B</tspan><tspan fill="#d8dee6">&#160;&#160;(era&#160;Bambu&#160;PLA&#160;Silk&#160;@BBL&#160;A1)</tspan></text>
    <text x="26" y="408"><tspan fill="#d8dee6">&#160;&#160;purga&#160;em&#160;mm3&#160;(x0.7&#160;na&#160;impressora):&#160;1&gt;2&#160;208,&#160;2&gt;1&#160;448&#160;&#160;&#160;(valores&#160;do&#160;autor)</tspan></text>
    <text x="26" y="427"><tspan fill="#d8dee6">&#160;&#160;torre&#160;de&#160;purga:&#160;1&#160;|&#160;posicao&#160;por&#160;prato:&#160;[(114,&#160;72),&#160;(114,&#160;68)]</tspan></text>
    <text x="26" y="446"><tspan fill="#d8dee6">&#160;&#160;prato&#160;1:&#160;Caixa:&#160;60.0&#160;x&#160;52.0&#160;x&#160;48.0&#160;mm&#160;(x&#160;100.0..160.0,&#160;y&#160;104.0..156.0)</tspan></text>
    <text x="26" y="465"><tspan fill="#d8dee6">&#160;&#160;prato&#160;2:&#160;Tampa:&#160;66.0&#160;x&#160;57.2&#160;x&#160;4.0&#160;mm&#160;(x&#160;97.0..163.0,&#160;y&#160;101.4..158.6)</tspan></text>
    <text x="26" y="484"><tspan fill="#58a6ff" font-weight="bold">FATIADO:</tspan><tspan fill="#d8dee6"></tspan></text>
    <text x="26" y="503"><tspan fill="#d8dee6">&#160;&#160;prato&#160;1:&#160;</tspan><tspan fill="#3fb950">1h&#160;16m&#160;54s</tspan><tspan fill="#d8dee6">,&#160;33.84&#160;g&#160;[27.3&#160;g&#160;(</tspan><tspan fill="#F2C94C" font-weight="bold">#F2C94C</tspan><tspan fill="#d8dee6">)&#160;+&#160;6.5&#160;g&#160;(</tspan><tspan fill="#C0392B" font-weight="bold">#C0392B</tspan><tspan fill="#d8dee6">)],&#160;240&#160;camadas,&#160;altura&#160;48.0&#160;mm,&#160;1&#160;troca&#160;de&#160;cor</tspan></text>
    <text x="26" y="522"><tspan fill="#d8dee6">&#160;&#160;prato&#160;2:&#160;</tspan><tspan fill="#3fb950">13m&#160;33s</tspan><tspan fill="#d8dee6">,&#160;6.66&#160;g&#160;[6.7&#160;g&#160;(</tspan><tspan fill="#F2C94C" font-weight="bold">#F2C94C</tspan><tspan fill="#d8dee6">)&#160;+&#160;0.0&#160;g&#160;(</tspan><tspan fill="#C0392B" font-weight="bold">#C0392B</tspan><tspan fill="#d8dee6">)],&#160;20&#160;camadas,&#160;altura&#160;4.0&#160;mm</tspan></text>
    <text x="26" y="541"><tspan fill="#58a6ff" font-weight="bold">CUSTO&#160;ESTIMADO:</tspan><tspan fill="#d8dee6">&#160;1.33&#160;EUR&#160;(filamento&#160;0.73&#160;+&#160;maquina&#160;0.60)</tspan></text>
    <text x="26" y="560"><tspan fill="#58a6ff" font-weight="bold">AVISOS:</tspan><tspan fill="#3fb950">&#160;nenhum</tspan></text>
  </g>
